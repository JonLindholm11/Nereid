[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nereid"
version = "0.1.0"
description = "Open source CSV/XLSX ↔ PostgreSQL two-way sync engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Lunar Systems" }
]
keywords = ["postgresql", "csv", "xlsx", "sync", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Utilities",
]

dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "watchdog>=4.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
gdrive = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-httplib2>=0.2",
]

[project.scripts]
nereid = "nereid.cli.main:cli"

[project.urls]
Homepage = "https://github.com/JonLindholm11/Nereid"
Repository = "https://github.com/JonLindholm11/Nereid"
Issues = "https://github.com/JonLindholm11/Nereid/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nereid --cov-report=term-missing"

[tool.setuptools.packages.find]
include = ["nereid*"]